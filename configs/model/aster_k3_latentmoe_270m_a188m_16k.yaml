model:
  vocab_size: 32768
  d_model: 768
  n_layers: 24
  n_heads: 12
  head_dim: 64
  ffn_hidden: 2048
  max_seq_len: 16384
  tie_embeddings: true
  kda_ratio: 3
  kda_backend: auto
  kda_expand_v: 1.0
  kda_short_conv: true
  kda_conv_size: 4
  kda_safe_gate: true
  kda_lower_bound: -5.0
  kda_allow_negative_eigenvalues: false
  latent_rank: 64
  rope_dim: 32
  attention_window: 8192
  sink_tokens: 64
  attention_dropout: 0.0
  attention_gate: true
  logit_softcap: null
  qk_stat_tokens: 32
  rope_theta: 1000000.0
  rope_scaling_type: yarn
  rope_scaling_factor: 2.0
  rope_original_max_position: 8192
  rms_eps: 1.0e-06
  residual_dropout: 0.0
  ffn_dropout: 0.0
  use_block_attnres: false
  attnres_block_size: 4
  attnres_key_dim: 64
  mtp_depth: 0
  mtp_rank: 256
  lm_loss_chunk_size: 256
  mtp_loss_weight: 0.15
  qk_clip_tau: 100.0
  init_std: 0.02
  gradient_checkpointing: true
  ffn_type: latent_moe
  moe_first_dense_layers: 1
  moe_every: 1
  moe_num_experts: 8
  moe_top_k: 2
  moe_shared_experts: 2
  moe_expert_hidden: 512
  latent_moe_dim: 384
  latent_moe_post_norm: true
  moe_activation: situ_glu
  moe_situ_beta_gate: 4.0
  moe_situ_beta_up: 25.0
  moe_router_score: sigmoid
  moe_balance_strategy: quantile
  moe_aux_loss_weight: 0.0
  moe_router_z_loss_weight: 1.0e-05
  kda_num_heads: 6
  kda_head_dim: 128
  norm_type: rmsnorm
  embedding_projection: false
  cache_dtype: bfloat16
  linear_backend: torch
  ffn_linear_backend: torch
