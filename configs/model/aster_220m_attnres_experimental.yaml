model:
  vocab_size: 32768
  d_model: 768
  n_layers: 24
  n_heads: 12
  head_dim: 64
  ffn_hidden: 2048
  max_seq_len: 8192
  tie_embeddings: true
  kda_ratio: 3
  kda_backend: auto
  kda_safe_gate: true
  kda_lower_bound: -5.0
  latent_rank: 64
  rope_dim: 32
  attention_window: 8192
  sink_tokens: 64
  attention_gate: true
  logit_softcap: null
  rope_theta: 1000000.0
  use_block_attnres: true
  attnres_block_size: 4
  attnres_key_dim: 64
  mtp_depth: 2
  mtp_rank: 256
  lm_loss_chunk_size: 256
  mtp_loss_weight: 0.15
  qk_clip_tau: 100.0
  gradient_checkpointing: true
