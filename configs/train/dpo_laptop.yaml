train:
  output_dir: runs/aster-220m-dpo
  seed: 2028
  device: cuda
  dtype: bfloat16
  compile: false
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1000
  max_tokens: null
  muon_lr: 0.0005
  adam_lr: 0.00002
  min_lr_ratio: 0.1
  schedule_type: wsd
  decay_fraction: 0.2
  decay_shape: cosine
  warmup_steps: 50
  weight_decay: 0.02
  adam_betas: [0.9, 0.95]
  muon_momentum: 0.95
  muon_nesterov: true
  muon_update_rms: 0.2
  max_grad_norm: 1.0
  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 1000
  eval_batches: 0
  save_interval: 250
  tokenizer_path: artifacts/tokenizer.json
