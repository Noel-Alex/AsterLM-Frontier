train:
  output_dir: runs/aster-target-stage1-4k
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  activation_offload_pin_memory: true
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  max_steps: 200000
  # Start with 4B; continue the WSD stable phase only after data/loss curves justify it.
  max_tokens: 4000000000
  optimizer: torchao_adamw4bit
  adam_lr: 0.0003
  muon_lr: 0.01
  min_lr_ratio: 0.1
  warmup_steps: 2000
  schedule_type: wsd
  decay_fraction: 0.1
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  qk_clip_interval: 100
  log_interval: 5
  eval_interval: 500
  eval_batches: 16
  save_interval: 500
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 50
  save_diagnostic_bundle: true
