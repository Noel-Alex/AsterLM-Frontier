train:
  output_dir: runs/aster-frontier-100b-stage2-16k
  seed: 1338
  run_class: final
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  execution_backend: aster_local
  execution_autotune: false
  moe_implementation: cutlass
  precision_backend: amp
  activation_offload: false
  sequence_length: 16384
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 50000
  max_tokens: 6000000000
  optimizer: muon_adamw
  muon_lr: 0.003
  muon_per_head: true
  muon_megabatch: true
  muon_megabatch_max_gib: 0.5
  adam_lr: 0.0001
  min_lr_ratio: 0.1
  warmup_steps: 750
  schedule_type: cosine
  decay_fraction: 0.15
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  qk_clip_interval: 50
  log_interval: 5
  eval_interval: 500
  eval_batches: 24
  save_interval: 1000
  keep_last_checkpoints: 6
  checkpoint_policy: full
  checkpoint_pyramid_levels: 8
  checkpoint_local_budget_gib: 150.0
  milestone_tokens: [500000000, 1000000000, 2000000000, 3000000000, 4500000000, 6000000000]
  milestone_eval: true
  num_workers: 0
  pin_memory: true
  prefetch_factor: null
  tokenizer_path: artifacts/tokenizer.json
  tokenizer_manifest_path: artifacts/tokenizer_manifest.json
  wandb_project: asterlm-frontier
  wandb_run_name: frontier-100b-stage2-16k
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 25
  save_diagnostic_bundle: true
  hub_repo_id: null
  hub_private: true
  hub_revision: main
  hub_upload_every_save: false
  hub_upload_milestones: true
  hub_upload_final: true
  hub_include_optimizer: true
  hub_fail_on_error: true
