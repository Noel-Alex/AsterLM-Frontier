train:
  output_dir: runs/aster-frontier-stage1-8k
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  activation_offload_pin_memory: true
  sequence_length: 8192
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 200000
  max_tokens: 16000000000
  optimizer: apollo_mini
  adam_lr: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 2000
  schedule_type: wsd
  decay_fraction: 0.1
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  apollo_rank: 1
  apollo_scale: 128.0
  apollo_scale_type: tensor
  apollo_update_proj_gap: 200
  qk_clip_interval: 100
  log_interval: 5
  eval_interval: 500
  eval_batches: 16
  save_interval: 500
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 50
  save_diagnostic_bundle: true
