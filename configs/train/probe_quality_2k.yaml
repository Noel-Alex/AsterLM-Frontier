train:
  output_dir: runs/quality-probe
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 100000
  max_tokens: 100000000
  optimizer: torchao_adamw4bit
  adam_lr: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 500
  schedule_type: wsd
  decay_fraction: 0.1
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 250
  eval_batches: 16
  save_interval: 1000
  keep_last_checkpoints: 1
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: false
  jsonl_metrics: true
  diagnostic_interval: 100
  save_diagnostic_bundle: true
