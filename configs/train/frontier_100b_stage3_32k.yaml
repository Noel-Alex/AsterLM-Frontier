train:
  output_dir: runs/aster-frontier-100b-stage3-32k
  seed: 1339
  run_class: final
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  execution_backend: aster_local
  execution_autotune: false
  moe_implementation: cutlass
  precision_backend: amp
  activation_offload: false
  sequence_length: 32768
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 20000
  max_tokens: 2000000000
  optimizer: muon_adamw
  muon_lr: 0.002
  muon_per_head: true
  muon_megabatch: true
  muon_megabatch_max_gib: 0.5
  adam_lr: 0.00005
  min_lr_ratio: 0.1
  warmup_steps: 250
  schedule_type: cosine
  decay_fraction: 0.25
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  qk_clip_interval: 25
  log_interval: 2
  eval_interval: 200
  eval_batches: 16
  save_interval: 250
  checkpoint_interval_minutes: 30.0
  keep_last_checkpoints: 6
  checkpoint_policy: full
  checkpoint_pyramid_levels: 8
  checkpoint_local_budget_gib: 150.0
  milestone_tokens: [250000000, 500000000, 1000000000, 1500000000, 2000000000]
  milestone_eval: true
  num_workers: 0
  pin_memory: true
  prefetch_factor: null
  tokenizer_path: artifacts/tokenizer.json
  tokenizer_manifest_path: artifacts/tokenizer_manifest.json
  wandb_project: asterlm-frontier
  wandb_run_name: frontier-100b-stage3-32k
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 10
  save_diagnostic_bundle: true
  hub_repo_id: null
  hub_private: true
  hub_revision: main
  hub_upload_every_save: false
  hub_upload_milestones: true
  hub_upload_final: true
  hub_upload_on_stop: true
  hub_auto_resume_latest: true
  hub_include_optimizer: true
  hub_fail_on_error: true
  hub_storage_guard_tb_decimal: 7.0
  hub_storage_hard_cap_tb_decimal: 7.5
