train:
  output_dir: runs/aster-frontier-100b-stage3-32k
  seed: 1339
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  sequence_length: 32768
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 20000
  max_tokens: 2000000000
  optimizer: torchao_cpu_offload_adamw
  adam_lr: 0.00005
  min_lr_ratio: 0.1
  warmup_steps: 250
  schedule_type: wsd
  decay_fraction: 0.25
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  qk_clip_interval: 25
  log_interval: 2
  eval_interval: 200
  eval_batches: 16
  save_interval: 500
  keep_last_checkpoints: 6
  milestone_tokens: [1000000000, 2000000000]
  milestone_eval: true
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  wandb_project: asterlm-frontier
  wandb_run_name: frontier-100b-stage3-32k
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 10
  save_diagnostic_bundle: true
  hub_repo_id: null
  hub_private: true
  hub_revision: main
  hub_upload_every_save: false
  hub_upload_milestones: true
  hub_upload_final: true
  hub_include_optimizer: true
  hub_fail_on_error: false
