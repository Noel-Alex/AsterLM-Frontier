train:
  output_dir: runs/aster-220m-pretrain
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  compile_mode: default

  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  max_steps: 100000
  max_tokens: 2000000000

  muon_lr: 0.01
  adam_lr: 0.0003
  min_lr_ratio: 0.1
  schedule_type: wsd
  decay_fraction: 0.1
  decay_shape: cosine
  warmup_steps: 300
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  muon_momentum: 0.95
  muon_nesterov: true
  muon_update_rms: 0.2
  muon_ns_steps: 5
  max_grad_norm: 1.0

  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 1000
  eval_batches: 32
  save_interval: 1000
  keep_last_checkpoints: 3
  resume: null

  num_workers: 0
  pin_memory: true
  prefetch_factor: null
  shuffle_buffer: 10000
  tokenizer_path: artifacts/tokenizer.json
  eos_token: <|endoftext|>
  pad_token: <|pad|>
  wandb_project: null
  wandb_run_name: null
