train:
  output_dir: runs/probe-memory
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: false
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 8
  optimizer: apollo_mini
  adam_lr: 0.0003
  muon_lr: 0.01
  warmup_steps: 1
  schedule_type: constant
  weight_decay: 0.1
  max_grad_norm: 1.0
  apollo_rank: 1
  apollo_scale_type: tensor
  qk_clip_interval: 100
  log_interval: 1
  eval_interval: 100000
  save_interval: 100000
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: false
  jsonl_metrics: true
  diagnostic_interval: 1
  save_diagnostic_bundle: false
