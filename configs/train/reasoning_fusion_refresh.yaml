train:
  output_dir: runs/aster-reasoning-fusion-refresh
  seed: 2031
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  activation_offload_pin_memory: true
  sequence_length: 8192
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 1500
  max_tokens: 100000000
  optimizer: torchao_cpu_offload_adamw
  adam_lr: 0.000005
  min_lr_ratio: 0.20
  warmup_steps: 50
  schedule_type: wsd
  decay_fraction: 0.30
  decay_shape: cosine
  weight_decay: 0.0
  adam_betas: [0.9, 0.95]
  max_grad_norm: 0.5
  qk_clip_interval: 50
  log_interval: 5
  eval_interval: 250
  eval_batches: 8
  save_interval: 250
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  diagnostic_interval: 25
  save_diagnostic_bundle: true
