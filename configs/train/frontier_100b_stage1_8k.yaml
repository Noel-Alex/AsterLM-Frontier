train:
  output_dir: runs/aster-frontier-100b-stage1-8k
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  activation_offload_pin_memory: true
  sequence_length: 8192
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 800000
  max_tokens: 92000000000
  optimizer: apollo_mini
  adam_lr: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 5000
  schedule_type: wsd
  decay_fraction: 0.05
  decay_shape: cosine
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  apollo_rank: 1
  apollo_scale: 128.0
  apollo_scale_type: tensor
  apollo_update_proj_gap: 200
  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 1000
  eval_batches: 32
  save_interval: 2000
  keep_last_checkpoints: 6
  milestone_tokens: [18400000000, 50000000000, 92000000000]
  milestone_eval: true
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  wandb_project: asterlm-frontier
  wandb_run_name: frontier-100b-stage1-8k
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 50
  save_diagnostic_bundle: true
  hub_repo_id: null
  hub_private: true
  hub_revision: main
  hub_upload_every_save: false
  hub_upload_milestones: true
  hub_upload_final: true
  hub_include_optimizer: true
  hub_fail_on_error: false
