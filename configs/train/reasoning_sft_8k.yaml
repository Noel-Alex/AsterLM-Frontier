train:
  output_dir: runs/aster-reasoning-sft-8k
  seed: 2029
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  activation_offload_pin_memory: true

  sequence_length: 8192
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 12000
  max_tokens: 1200000000

  # Full-model post-training with optimizer states kept off GPU. This is slower,
  # but preserves the base model's full capacity within a 12 GiB VRAM envelope.
  optimizer: torchao_cpu_offload_adamw
  adam_lr: 0.00002
  min_lr_ratio: 0.10
  warmup_steps: 300
  schedule_type: wsd
  decay_fraction: 0.20
  decay_shape: cosine
  weight_decay: 0.02
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  max_grad_norm: 1.0

  qk_clip_interval: 50
  log_interval: 5
  eval_interval: 250
  eval_batches: 8
  save_interval: 250
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  system_metrics_interval: 5.0
  diagnostic_interval: 25
  save_diagnostic_bundle: true
