train:
  output_dir: runs/aster-moe-stage1-4k
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false

  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 1000000
  max_tokens: 6000000000

  optimizer: apollo_mini
  adam_lr: 0.003
  adam_betas: [0.9, 0.95]
  adam_eps: 1.0e-8
  weight_decay: 0.1
  apollo_rank: 1
  apollo_scale: 128.0
  apollo_scale_type: tensor
  apollo_update_proj_gap: 200
  apollo_scale_front: false
  max_grad_norm: 1.0

  schedule_type: wsd
  warmup_steps: 2000
  min_lr_ratio: 0.1
  decay_fraction: 0.12
  decay_shape: cosine

  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 1000
  eval_batches: 16
  save_interval: 1000
  keep_last_checkpoints: 3

  num_workers: 0
  tokenizer_path: artifacts/tokenizer.json
  wandb_project: asterlm
