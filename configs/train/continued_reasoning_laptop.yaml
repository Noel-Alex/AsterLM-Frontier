train:
  output_dir: runs/aster-220m-reasoning
  seed: 2027
  device: cuda
  dtype: bfloat16
  compile: false
  sequence_length: 4096
  micro_batch_size: 1
  gradient_accumulation_steps: 24
  max_steps: 20000
  max_tokens: 300000000
  muon_lr: 0.003
  adam_lr: 0.00009
  min_lr_ratio: 0.1
  schedule_type: wsd
  decay_fraction: 0.1
  decay_shape: cosine
  warmup_steps: 60
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  muon_momentum: 0.95
  muon_nesterov: true
  muon_update_rms: 0.2
  max_grad_norm: 1.0
  qk_clip_interval: 100
  log_interval: 10
  eval_interval: 250
  eval_batches: 16
  save_interval: 250
  tokenizer_path: artifacts/tokenizer.json
