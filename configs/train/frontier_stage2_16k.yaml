train:
  output_dir: runs/aster-frontier-stage2-16k
  seed: 1338
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  sequence_length: 16384
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 20000
  max_tokens: 2000000000
  optimizer: apollo_mini
  adam_lr: 0.00012
  min_lr_ratio: 0.1
  warmup_steps: 500
  schedule_type: wsd
  decay_fraction: 0.2
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  apollo_rank: 1
  apollo_scale_type: tensor
  qk_clip_interval: 50
  log_interval: 5
  eval_interval: 250
  eval_batches: 12
  save_interval: 250
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  diagnostic_interval: 25
  save_diagnostic_bundle: true
