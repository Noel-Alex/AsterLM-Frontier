train:
  output_dir: runs/architecture-campaign/tier0-systems
  seed: 1337
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: false
  sequence_length: 2048
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 20
  optimizer: adamw
  adam_lr: 0.0003
  warmup_steps: 2
  schedule_type: constant
  weight_decay: 0.1
  max_grad_norm: 1.0
  qk_clip_interval: 100
  log_interval: 1
  eval_interval: 100000
  save_interval: 100000
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: false
  jsonl_metrics: true
  diagnostic_interval: 100
  save_diagnostic_bundle: false
