train:
  output_dir: runs/aster-frontier-stage3-32k
  seed: 1339
  device: cuda
  dtype: bfloat16
  matmul_precision: high
  compile: false
  precision_backend: amp
  activation_offload: true
  sequence_length: 32768
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 10000
  max_tokens: 750000000
  optimizer: torchao_cpu_offload_adamw
  adam_lr: 0.00006
  min_lr_ratio: 0.1
  warmup_steps: 250
  schedule_type: wsd
  decay_fraction: 0.25
  weight_decay: 0.1
  adam_betas: [0.9, 0.95]
  max_grad_norm: 1.0
  qk_clip_interval: 25
  log_interval: 2
  eval_interval: 100
  eval_batches: 8
  save_interval: 100
  keep_last_checkpoints: 3
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  tokenizer_path: artifacts/tokenizer.json
  tensorboard: true
  jsonl_metrics: true
  diagnostic_interval: 10
  save_diagnostic_bundle: true
