checkpointing:
  public_hub_repository: philoweeb/AsterLM-Frontier-100B
  local_budget_gib: 150
  laptop_recovery_interval_minutes: 30
  cloud_recovery_interval_minutes: 5
  recovery_interval_steps: 250
  recent_full_state_checkpoints: 6
  logarithmic_history_levels: 8
  remote_recent_full_state_checkpoints_per_stage: 6
  remote_logarithmic_history_levels_per_stage: 8
  huggingface_hard_cap_tb_decimal: 7.5
  huggingface_operational_guard_tb_decimal: 7.0
  estimated_weights_only_checkpoint_gib: 2.70
  pessimistic_full_state_checkpoint_gib: 6.0
  projected_local_dense_recent_gib: 36.0
  permanent_checkpoint_count: 28
  projected_remote_permanent_checkpoint_gib: 168.0
  projected_remote_rolling_spine_gib: 336.0
  projected_remote_total_checkpoint_gib: 504.0
  policy: dense rolling recovery checkpoints near the frontier plus logarithmically thinned history and permanent token milestones
  cloud_policy: save a public Hugging Face full-state checkpoint at least every five minutes; overlap transfer with training through one bounded worker; advance latest and permit pruning only after exact remote hash verification; resume from the newest valid Hub checkpoint across providers
  remote_retention_policy: preserve every permanent token milestone and final; for each stage retain six recent recovery points plus eight logarithmically older recovery points; batch-delete only superseded verified rolling folders
  remote_quota_policy: refuse any planned upload whose pessimistic projected repository usage exceeds 7.0 TB; never cross the 7.5 TB hard ceiling
  portable_inference: scripts/infer.py --hub-repo REPO --hub-run RUN --hub-selector tokens:N
observability:
  local: append-only metrics.jsonl plus run, analysis, checkpoint, profiler, energy, and diagnostic manifests
  remote: W&B scalar history, system telemetry, evaluation tables, and diagnostics artifacts
  refresh_seconds: 2
  primary_axis: tokens_seen
  research_ui_port: 8765
  grokking_signals:
    - heldout loss and perplexity inflections
    - domain evaluation trajectories
    - train-validation gap
    - expert pathway entropy and specialization
    - gradient and update subsystem health
    - memorization and contamination probes
inference_state_after_pretraining:
  behavior: base next-token completion model
  chat_readiness: requires later post-training
  architectural_context_ceiling_tokens: 262144
  stretch_context_tokens: 1048576
  stretch_context_claim: candidate_until_long-context_retrieval_and_generation_gates_pass
  supported_checkpoint_modes: [local, huggingface_latest, huggingface_final, huggingface_token_milestone]
launch_policy:
  remote_jobs_default: disabled
  architecture_search: closed
  architecture_selection: frozen
  promotion_phases:
    stage1: base-run correctness, quality, durability, data, tracking, and inference-runtime gates
    stage2: stage1 gates plus long-context retrieval from a trained stage1 checkpoint
    stage3: revalidate the long-context evidence against the promoted stage2 checkpoint before launch
    stage4: revalidate the long-context evidence against the promoted stage3 checkpoint before launch
    campaign_complete: require retrieval/interference evidence through 262K from the completed 32K-trained final checkpoint
  required_before_stage1:
    - sealed clean corpus and decontamination manifest
    - tokenizer seal and fertility report
    - finite native-context canary and exact resume
    - W&B login and public Hugging Face repository
    - Hub upload/download hash round trip
    - clean pinned Git commit
