schema_version: 1
profiles:
  noelalex404:
    modal_environment: main
    app_name: asterlm-boost-noelalex404
    # Use an NVIDIA PyTorch image pinned by registry digest. B300 attempts require CUDA 13.1+.
    base_image: SET_AFTER_PINNING_NVIDIA_CUDA_13_1_IMAGE
    cuda_minor: "13.1"
    repository_url: https://github.com/Noel-Alex/AsterLM-Frontier.git
    dataset_volume: aster-data-noelalex404
    cache_volume: aster-cache-noelalex404
    checkpoint_volume: aster-checkpoints-noelalex404
    volume_version: 2
    hf_secret: aster-hf-token
    wandb_secret: aster-wandb-api-key
    timeout_minutes: 720
    dispatch_enabled: false
    spend_budget_confirmed: false
    max_spend_usd_per_job: 30.0
    cost_contingency: 1.50
    gpu_candidates:
      - {gpu: B300, min_cuda: "13.1", usd_per_second: 0.001972, role: maximum_throughput_candidate}
      - {gpu: H200, min_cuda: "12.4", usd_per_second: 0.001261, role: long_context_capacity_candidate}
      - {gpu: H100!, min_cuda: "12.1", usd_per_second: 0.001097, role: exact_h100_reproducibility_candidate}
      - {gpu: A100-80GB, min_cuda: "11.8", usd_per_second: 0.000694, role: price_per_quality_control}
      - {gpu: L40S, min_cuda: "12.1", usd_per_second: 0.000542, role: low_cost_small_scale_control}
